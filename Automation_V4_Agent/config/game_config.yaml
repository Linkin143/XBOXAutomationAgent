# --- Report settings ---
report:
  name_template: "Gen9_vNext_AnacondaReport-{timestamp}.docx"
  template_file: "TextX_Template_Report.docx"
  output_folder: "Report\\Results\\"
  timestamp_format: "%b%d-%Y_%I-%M-%S%p"

# --- Timeouts (seconds) ---
timeouts:
  pattern_match: 30
  ocr_verify: 10
  game_launch: 60
  home_screen: 20
  guide_open: 10
